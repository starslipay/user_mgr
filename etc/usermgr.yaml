Name: usermgr.rpc
ListenOn: 0.0.0.0:8080
Timeout: 10000
Etcd:
  Hosts:
    - etcd:2379  # etcd 集群节点1
    - etcd2:2379 # etcd 集群节点2, 任一节点可用即可
    - etcd3:2379 # etcd 集群节点3
    # - etcd-0.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-1.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-2.etcd.pay-ns.svc.cluster.local:2379
  Key: usermgr.rpc
Middlewares:
  Breaker: false  # 关闭服务端熔断
  Shedding: false # 关闭自适应降载（service overloaded，不是熔断，一并关掉）
CpuThreshold: 0 # 0 关闭CPU过载降载兜底保护

MasterDBConfig:
  # DataSource: root:root123456@tcp(mysql-primary.pay-ns.svc.cluster.local:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s  # k8s
  DataSource: root:root123456@tcp(mysql-master:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s  # 开发环境
  # 连接池配置
  MaxOpenConns: 500        # 最大打开连接数
  MaxIdleConns: 500        # 最大空闲连接数
  ConnMaxLifetimeSec: 60   # 连接最大存活时间(秒)

SlaveDBConfig:
  # DataSource: starslipay:starslipay123456@tcp(mysql-slave.pay-ns.svc.cluster.local:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s
  DataSource: root:root123456@tcp(mysql-master:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s  # 开发环境
  # 连接池配置
  MaxOpenConns: 500        # 最大打开连接数
  MaxIdleConns: 500        # 最大空闲连接数
  ConnMaxLifetimeSec: 60   # 连接最大存活时间(秒)

AccountMgrRpcConfig:
  Etcd:
    Hosts:
      - etcd:2379  # etcd 集群节点1
      - etcd2:2379 # etcd 集群节点2, 任一节点可用即可
      - etcd3:2379 # etcd 集群节点3
    # - etcd-0.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-1.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-2.etcd.pay-ns.svc.cluster.local:2379
    Key: accountmgr.rpc  # 注册到etcd的服务key，客户端要对应这个key
  Timeout: 10000  # 超时时间，单位毫秒

TradeIdMgrRpcConfig:
  Etcd:
    Hosts:
      - etcd:2379  # etcd 集群节点1
      - etcd2:2379 # etcd 集群节点2, 任一节点可用即可
      - etcd3:2379 # etcd 集群节点3
    # - etcd-0.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-1.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-2.etcd.pay-ns.svc.cluster.local:2379
    Key: tradeidmgr.rpc  # 注册到etcd的服务key，客户端要对应这个key
  Timeout: 10000  # 超时时间，单位毫秒

# Kafka 生产者配置 (3 节点集群, 客户端自动发现所有 broker)
KafkaProducerConf:
  - kafka1:29092
  - kafka2:29092
  - kafka3:29092
# relation 缓存更新消息 topic, 由 cache_consumer 消费后回调 cache_mgr 写入 redis
TopicUpdateRelation: t_update_relation

# Prometheus 指标采集：go-zero 会另起一个独立 HTTP 端口暴露 /metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics

# 链路追踪：go-zero 通过 OTLP 协议发送 trace 到 Tempo
Telemetry:
  Name: user_mgr
  Endpoint: tempo:4318
  Batcher: otlphttp
  Sampler: 1.0

# AccessLog: 请求/响应日志记录(按字段名脱敏)
AccessLog:
  Enable: true
  SensitiveFields:
    - password
    - user_token
    - old_password
    - new_password
    - pay_password